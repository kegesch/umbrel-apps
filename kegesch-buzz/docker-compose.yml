version: "3.7"

# App-internal secrets (DB/S3/M HMAC) are generated at packaging time and
# scoped to this compose network only - they are not user-facing credentials.
services:
  app_proxy:
    environment:
      APP_HOST: kegesch-buzz_relay_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"
    container_name: kegesch-buzz_app_proxy_1

  relay:
    image: ghcr.io/kegesch/umbrel-apps/kegesch-buzz:0.1.5
    container_name: kegesch-buzz_relay_1
    restart: on-failure
    stop_grace_period: 1m
    # NOTE: do NOT publish host ports here. umbrelOS binds the manifest
    # `port` (2112) onto the app_proxy container itself; a second bind on
    # the relay collides ("port is already allocated") and the relay hangs
    # in Created state, blocking app install at 1%. LAN clients reach the
    # relay through the app-proxy (HTTP + WebSocket pass-through).
    environment:
      # Community identity: MUST byte-match the URL clients connect with
      # (scheme + host + port). Seeded at startup; changing it re-seeds a
      # FRESH, empty community. Default targets Tailscale MagicDNS; override
      # via app-data/kegesch-buzz/data/buzz/relay.env (see exports.sh).
      - RELAY_URL=${BUZZ_RELAY_URL:-ws://umbrel.taild90d7a.ts.net:2112}
      - BUZZ_BIND_ADDR=0.0.0.0:3000
      - BUZZ_HEALTH_PORT=8080
      - BUZZ_METRICS_PORT=9102
      - DATABASE_URL=postgres://buzz:28075552682a304b8627c8e6@postgres:5432/buzz
      - REDIS_URL=redis://:42ec9035dad58fd11eb65a0c@redis:6379
      - BUZZ_S3_ENDPOINT=http://minio:9000
      - BUZZ_S3_ADDRESSING_STYLE=path
      - BUZZ_S3_ACCESS_KEY=buzz1463c38b413f
      - BUZZ_S3_SECRET_KEY=8be71cf686ddff9b5110340c855a896e5e3dd891
      - BUZZ_S3_BUCKET=buzz-media
      - BUZZ_GIT_REPO_PATH=/data/git
      - BUZZ_GIT_HOOK_HMAC_SECRET=e9edd16d9c3dae9b073d1a9fc2a5bb80035798f69345eac6
      # Key material (BUZZ_RELAY_PRIVATE_KEY, RELAY_OWNER_PUBKEY) is provided
      # by the entrypoint from /data/buzz/keys.env (generated on first start).
      # NOTE: unquoted booleans on purpose - compose list-form env does NOT
      # strip quotes, and the relay's bool parsing would see `"true"`.
      - BUZZ_AUTO_MIGRATE=true
      - BUZZ_GIT_CONFORMANCE_PROBE=true
      - RUST_LOG=buzz_relay=info,buzz_db=info,buzz_auth=info,buzz_pubsub=info,tower_http=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      # The upstream runtime image has bash but NO curl/wget/socat — probe
      # /_readiness over bash's /dev/tcp (same approach as upstream compose).
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    container_name: kegesch-buzz_postgres_1
    restart: on-failure
    environment:
      - POSTGRES_DB=buzz
      - POSTGRES_USER=buzz
      - POSTGRES_PASSWORD=28075552682a304b8627c8e6
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ${APP_DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz -d buzz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: kegesch-buzz_redis_1
    restart: on-failure
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "42ec9035dad58fd11eb65a0c"]
    volumes:
      - ${APP_DATA_DIR}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a 42ec9035dad58fd11eb65a0c ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: kegesch-buzz_minio_1
    restart: on-failure
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=buzz1463c38b413f
      - MINIO_ROOT_PASSWORD=8be71cf686ddff9b5110340c855a896e5e3dd891
    volumes:
      - ${APP_DATA_DIR}/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: kegesch-buzz_minio_init_1
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - BUZZ_S3_ACCESS_KEY=buzz1463c38b413f
      - BUZZ_S3_SECRET_KEY=8be71cf686ddff9b5110340c855a896e5e3dd891
    entrypoint: >
      /bin/sh -euc '
      mc alias set local http://minio:9000 "$$BUZZ_S3_ACCESS_KEY" "$$BUZZ_S3_SECRET_KEY";
      mc mb --ignore-existing local/buzz-media;
      mc anonymous set none local/buzz-media
      '
    restart: "no"
